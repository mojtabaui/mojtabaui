<!--
  جدولِ تصمیم — پنج وضعیت، پنج راه.

  ستونِ راست وضعیتِ توست و ستونِ چپ جواب. عمداً جدول نیست و خطِ
  عمودی ندارد: چیزی که خوانده می‌شود پنج سطرِ مستقل است، نه یک
  ماتریس. هر سطر باید بدونِ خواندنِ بقیه معنی بدهد.
-->
<svg viewBox="0 0 720 320" role="img" aria-label="جدولِ تصمیم: کدام راه برای کدام وضعیت">
  <g stroke="var(--line)">
    <path d="M0 0 H720"/>
    <path d="M0 64 H720"/>
    <path d="M0 128 H720"/>
    <path d="M0 192 H720"/>
    <path d="M0 256 H720"/>
    <path d="M0 320 H720"/>
  </g>

  <g style="direction:rtl" text-anchor="start" fill="var(--ink)" font-size="14.5">
    <text x="714" y="40">فقط می‌خواهم دوره را تماشا کنم</text>
    <text x="714" y="104">می‌خواهم فصلِ اول را همراهِ درس جلو بیایم</text>
    <text x="714" y="168">کارم تکراری و حجمی است، یا داده‌ام محرمانه</text>
    <text x="714" y="232">می‌خواهم چند مدل را روی یک کار مقایسه کنم</text>
    <text x="714" y="296">می‌خواهم پروژه را تا انتشار جلو ببرم</text>
  </g>

  <g style="direction:rtl" text-anchor="end" font-size="14" font-weight="700">
    <text x="6" y="40"  fill="var(--mute)">هیچ‌چیز</text>
    <text x="6" y="104" fill="var(--ink)">نسخهٔ رایگانِ اپِ چت</text>
    <text x="6" y="168" fill="var(--ink)">مدلِ محلی</text>
    <text x="6" y="232" fill="var(--ink)">کلیدِ رایگانِ API</text>
    <text x="6" y="296" fill="var(--accent)">یک اشتراک</text>
  </g>
</svg>
